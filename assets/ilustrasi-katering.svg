    <text x="68" y="98" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff">TEMBALANG</text>
  </g>

  <!-- ===== Penanda lokasi & jalur antar ===== -->
  <path d="M60 200 q40-70 110-90" fill="none" stroke="#1f6f50" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g transform="translate(40 168)">
    <path d="M20 0 a20 20 0 0 1 20 20 c0 15-20 36-20 36 s-20-21-20-36 a20 20 0 0 1 20-20z" fill="#1f6f50"/>
    <circle cx="20" cy="20" r="8" fill="#ffffff"/>
  </g>

  <!-- daun -->
  <g fill="#5f9e4a">
    <path d="M470 300 q-30-10-34-40 q30 8 34 40z"/>
    <path d="M470 300 q8-30 34-36 q-6 30-34 36z" fill="#4c8a3a"/>
    <path d="M58 302 q-24-6-28-30 q24 6 28 30z" fill="#4c8a3a"/>
