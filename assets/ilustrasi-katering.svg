<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="judul">
  <title id="judul">Ilustrasi hidangan katering: tumpeng, nasi kotak, dan kurir pengantar</title>

  <!-- latar -->
