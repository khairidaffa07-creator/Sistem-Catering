  <circle cx="420" cy="70" r="38" fill="#f6dcb0"/>
  <circle cx="92" cy="92" r="20" fill="#e3f1ea"/>
  <circle cx="470" cy="250" r="14" fill="#e3f1ea"/>

  <!-- uap -->
  <g fill="none" stroke="#d9cdb6" stroke-width="5" stroke-linecap="round">
    <path d="M196 62c-10-12 10-20 0-34"/>
    <path d="M222 54c-10-12 10-20 0-34"/>
    <path d="M384 132c-8-10 8-16 0-28"/>
  </g>

  <!-- bayangan meja -->
  <ellipse cx="260" cy="292" rx="215" ry="16" fill="#e9dcc3"/>

  <!-- ===== Tumpeng ===== -->
  <ellipse cx="208" cy="276" rx="118" ry="20" fill="#8a5a2b"/>
  <ellipse cx="208" cy="270" rx="118" ry="20" fill="#b57a3e"/>
  <ellipse cx="208" cy="266" rx="104" ry="15" fill="#5f9e4a"/>
