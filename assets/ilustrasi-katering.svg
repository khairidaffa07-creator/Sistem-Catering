  <path d="M208 88 L266 262 L238 262 Z" fill="#d99b22"/>
  <path d="M168 210 q40 10 80 0" fill="none" stroke="#e0a52c" stroke-width="3"/>
  <path d="M182 168 q26 8 52 0" fill="none" stroke="#e0a52c" stroke-width="3"/>
  <!-- hiasan puncak -->
  <path d="M208 70 q-4 10 0 22 q4-12 0-22z" fill="#c8402c"/>
  <path d="M208 80 q-16-6-20 6 q12 2 20-6z" fill="#4c8a3a"/>
  <path d="M208 80 q16-6 20 6 q-12 2-20-6z" fill="#5f9e4a"/>
  <!-- lauk di sekeliling -->
  <g>
    <ellipse cx="122" cy="262" rx="17" ry="10" fill="#9b5a25"/>
    <ellipse cx="119" cy="259" rx="10" ry="5" fill="#b87336"/>
    <circle cx="296" cy="262" r="12" fill="#fff"/>
    <circle cx="296" cy="262" r="6" fill="#f3b72e"/>
    <circle cx="150" cy="276" r="9" fill="#fff"/>
    <circle cx="150" cy="276" r="4.5" fill="#f3b72e"/>
    <ellipse cx="264" cy="279" rx="14" ry="7" fill="#9b5a25"/>
    <circle cx="186" cy="281" r="7" fill="#8cc06a"/>
    <circle cx="186" cy="281" r="3.5" fill="#d9efc8"/>
    <circle cx="232" cy="283" r="7" fill="#8cc06a"/>
    <circle cx="232" cy="283" r="3.5" fill="#d9efc8"/>
    <path d="M100 270 q8-6 16 0" fill="none" stroke="#c8402c" stroke-width="4" stroke-linecap="round"/>
    <path d="M312 270 q8-6 16 0" fill="none" stroke="#c8402c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ===== Nasi kotak ===== -->
  <g transform="translate(330 150)">
    <!-- tutup terbuka -->
    <path d="M6 44 L26 0 L142 0 L128 44 Z" fill="#d8a066"/>
    <path d="M26 0 L142 0 L138 10 L22 10 Z" fill="#e7b47c"/>
    <text x="78" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#8a5413">DAPUR</text>
    <!-- badan kotak -->
    <path d="M0 44 H136 L128 120 H8 Z" fill="#c98a4b"/>
    <path d="M0 44 H136 L134 54 H2 Z" fill="#b57a3e"/>
    <!-- isi -->
    <rect x="10" y="52" width="116" height="22" rx="4" fill="#f7f2e8"/>
    <ellipse cx="38" cy="58" rx="24" ry="13" fill="#ffffff"/>
    <ellipse cx="38" cy="55" rx="18" ry="8" fill="#fbfaf6"/>
    <path d="M70 62 q12-22 30-10 q10 8-2 16 q-14 8-28-6z" fill="#a65e26"/>
    <path d="M96 56 l14-8 q4-2 5 2 q1 4-4 5 l-13 4z" fill="#f2e6d4"/>
    <circle cx="112" cy="64" r="7" fill="#c8402c"/>
    <path d="M58 70 q6-10 14-2" fill="none" stroke="#4c8a3a" stroke-width="5" stroke-linecap="round"/>
    <path d="M16 70 q6-8 12-2" fill="none" stroke="#5f9e4a" stroke-width="5" stroke-linecap="round"/>
    <!-- pita label -->
